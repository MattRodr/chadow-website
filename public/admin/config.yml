#  ============================================================
#  CHADOW — Configuration de l'interface d'admin (Sveltia CMS)
#  ============================================================
#  Organisation : par PAGE, puis par SOUS-SECTION.
#  Les photos importées atterrissent dans public/images/uploads/.
#  ============================================================

backend:
  name: github
  repo: MattRodr/chadow-website
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "fr"
site_url: "https://chadow.photo"
display_url: "https://chadow.photo"

collections:
  # ======================= ACCUEIL =======================
  - name: "accueil"
    label: "🏠 Accueil"
    files:
      - name: "galerie"
        label: "Galerie défilante (haut de page)"
        file: "src/data/cms/home-hero.json"
        icon: "photo_library"
        description: "Les photos qui défilent en haut de la page d'accueil."
        fields:
          - name: "gallery"
            label: "Photos"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.context}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "alt", label: "Description (accessibilité)", widget: "string", hint: "Décris brièvement la photo" }
              - { name: "context", label: "Contexte (artiste · lieu)", widget: "string", required: false }

      - name: "latest-moments"
        label: "Latest moments (grille)"
        file: "src/data/cms/home-recent.json"
        icon: "grid_view"
        description: "La grille de 6 photos sous le hero (section « Latest moments »). Si tu mets moins de 6 photos, la première sera dupliquée."
        fields:
          - name: "gallery"
            label: "Photos"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.context}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "alt", label: "Description (accessibilité)", widget: "string", hint: "Décris brièvement la photo" }
              - { name: "context", label: "Contexte (artiste · lieu)", widget: "string", required: false }

      - name: "photos-uniques"
        label: "Photos uniques"
        file: "src/data/cms/home-singles.json"
        icon: "image"
        description: "Deux grandes images de la page d'accueil."
        fields:
          - { name: "teaser", label: "Bloc « I'm Ambre »", widget: "image", hint: "Photo à côté de la présentation d'Ambre" }
          - { name: "quote", label: "Citation « No staging » (fond)", widget: "image", hint: "Aussi utilisée sur la page À propos" }

  # ======================= À PROPOS =======================
  - name: "apropos"
    label: "👤 À propos"
    files:
      - name: "portrait"
        label: "Portrait"
        file: "src/data/cms/about.json"
        icon: "person"
        description: "Le grand portrait en haut de la page À propos."
        fields:
          - { name: "portrait", label: "Portrait d'Ambre", widget: "image" }

      - name: "instagram"
        label: "Mosaïque Instagram"
        file: "src/data/cms/about-instagram.json"
        icon: "grid_view"
        description: "Les 4 photos de la mosaïque « Follow the work as it happens » sur la page À propos."
        fields:
          - name: "mosaic"
            label: "Photos (4)"
            label_singular: "Photo"
            widget: "list"
            min: 4
            max: 4
            summary: "{{fields.alt}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "alt", label: "Description (accessibilité)", widget: "string", hint: "Décris brièvement la photo" }

  # ======================= PORTFOLIO =======================
  - name: "portfolio"
    label: "🖼️ Portfolio"
    files:
      - name: "selected"
        label: "Selected Work (onglet « tout »)"
        file: "src/data/cms/portfolio-selected.json"
        icon: "star"
        description: "La sélection curatée affichée sur l'onglet « Selected Work » de la page Portfolio. Choisis librement les meilleures photos, indépendamment des sous-catégories."
        fields:
          - name: "photos"
            label: "Photos — Selected Work"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.title}} — {{fields.context}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "context", label: "Contexte (lieu · date)", widget: "string", required: false }

      - name: "live"
        label: "Live & Stage"
        file: "src/data/cms/portfolio-live.json"
        icon: "stadium"
        description: "Concerts, festivals, performances live."
        fields:
          - name: "photos"
            label: "Photos — Live & Stage"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.title}} — {{fields.context}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "context", label: "Contexte (lieu · date)", widget: "string", required: false }

      - name: "nightlife"
        label: "Nightlife"
        file: "src/data/cms/portfolio-nightlife.json"
        icon: "nightlife"
        description: "DJ sets, clubs, dancefloors, ambiances de nuit."
        fields:
          - name: "photos"
            label: "Photos — Nightlife"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.title}} — {{fields.context}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "context", label: "Contexte (lieu · date)", widget: "string", required: false }

      - name: "portraits"
        label: "Portraits & Editorial"
        file: "src/data/cms/portfolio-portraits.json"
        icon: "portrait"
        description: "Séances studio, portraits, photographie éditoriale."
        fields:
          - name: "photos"
            label: "Photos — Portraits & Editorial"
            label_singular: "Photo"
            widget: "list"
            summary: "{{fields.title}} — {{fields.context}}"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "title", label: "Titre", widget: "string" }
              - { name: "context", label: "Contexte (lieu · date)", widget: "string", required: false }

  # ======================= SERVICES =======================
  - name: "services"
    label: "💼 Services"
    files:
      - name: "images"
        label: "Images des services"
        file: "src/data/cms/services.json"
        icon: "work"
        description: "Pour chaque service : une vignette (aperçu accueil) + une grande image (page Services)."
        fields:
          - name: "live-nightlife-coverage"
            label: "Live & Nightlife Coverage"
            widget: "object"
            fields:
              - { name: "card", label: "Vignette (aperçu accueil)", widget: "image" }
              - { name: "detail", label: "Grande image (page Services)", widget: "image" }
          - name: "portraits-editorial"
            label: "Portraits & Editorial"
            widget: "object"
            fields:
              - { name: "card", label: "Vignette (aperçu accueil)", widget: "image" }
              - { name: "detail", label: "Grande image (page Services)", widget: "image" }
          - name: "event-coverage"
            label: "Event Coverage"
            widget: "object"
            fields:
              - { name: "card", label: "Vignette (aperçu accueil)", widget: "image" }
              - { name: "detail", label: "Grande image (page Services)", widget: "image" }
          - name: "video-content"
            label: "Video Content"
            widget: "object"
            fields:
              - { name: "card", label: "Vignette (aperçu accueil)", widget: "image" }
              - { name: "detail", label: "Grande image (page Services)", widget: "image" }

  # ======================= CONTACT =======================
  - name: "contact"
    label: "✉️ Contact"
    files:
      - name: "photo"
        label: "Photo du formulaire"
        file: "src/data/cms/contact.json"
        icon: "mail"
        description: "La photo affichée à côté du formulaire de contact."
        fields:
          - { name: "image", label: "Photo", widget: "image" }

  # ======================= MARIAGE (privé) =======================
  - name: "mariage"
    label: "💍 Mariage (page privée)"
    files:
      - name: "galerie"
        label: "Galerie mariage"
        file: "src/data/cms/weddings.json"
        icon: "favorite"
        description: "Galerie de la page Mariage envoyée par lien direct (non publique)."
        fields:
          - name: "gallery"
            label: "Photos"
            label_singular: "Photo"
            widget: "list"
            fields:
              - { name: "src", label: "Photo", widget: "image" }
              - { name: "alt", label: "Description (accessibilité)", widget: "string", required: false }
