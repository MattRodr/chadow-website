<!doctype html>
<!--
  Formulaire statique caché — UNIQUEMENT pour la détection Netlify Forms.
  Netlify scanne ce fichier au déploiement et enregistre le formulaire "contact".
  Le vrai formulaire (src/components/ContactForm.astro) envoie vers celui-ci.
  Ne pas supprimer. Les champs doivent rester identiques à ceux du vrai formulaire.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="event-type" />
      <input type="date" name="event-date" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
